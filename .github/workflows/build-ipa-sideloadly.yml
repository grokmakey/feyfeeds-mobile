name: 📱 Build IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ipa:
    name: 🔨 Build iOS IPA (Unsigned for Sideloadly)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🩹 Patch Swift syntax in expo-modules-jsi for Xcode 16 compatibility
        run: |
          sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' node_modules/expo-modules-jsi/apple/Package.swift || true
          find node_modules/expo-modules-jsi/apple/Sources -name "*.swift" -exec sed -i '' 's/weak let/nonisolated(unsafe) weak var/g' {} +
          find node_modules/expo-modules-jsi/apple/Sources -name "*.swift" -exec sed -i '' 's/weak var/nonisolated(unsafe) weak var/g' {} +
          sed -i '' 's/_ arguments: consuming JavaScriptValuesBuffer,/_ arguments: consuming JavaScriptValuesBuffer/g' node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift || true

      - name: 🌐 Build mobile web assets
        run: pnpm --dir apps/mobile/web-app build --outDir "${{ github.workspace }}/out/rn-web/html-renderer"

      - name: 🍎 CocoaPods Install
        working-directory: apps/mobile/ios
        run: |
          pod install --repo-update

      - name: 🔨 Build iOS App (Unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Folo.xcworkspace \
            -scheme Folo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package .ipa for Sideloadly
        working-directory: apps/mobile/ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Folo.app Payload/
          zip -r FeyFeeds.ipa Payload

      - name: 📤 Upload FeyFeeds IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeyFeeds-iOS-IPA
          path: apps/mobile/ios/FeyFeeds.ipa
          retention-days: 30
