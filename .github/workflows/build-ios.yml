name: 🍎 Build iOS IPA for Sideloadly

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/actions/setup-xcode/**"
      - ".github/workflows/build-ios.yml"
      - ".github/scripts/build-ios-unsigned-ipa.sh"
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-runner:
    if: github.secret_source != 'None'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.set-runner.outputs.runner-label }}
    steps:
      - name: Set runner
        id: set-runner
        run: |
          runners=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.RUNNER_GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          available=$(echo "$runners" | jq '.runners[]? | select(.status == "online" and .busy == false and .labels[] .name == "macOS")')
          if [ -n "$available" ]; then
            echo "runner-label=self-hosted" >> $GITHUB_OUTPUT
          else
            echo "runner-label=macos-26" >> $GITHUB_OUTPUT
          fi

  build-ipa-self-hosted:
    name: Build unsigned IPA (self-hosted)
    if: needs.check-runner.outputs.runner-label == 'self-hosted'
    needs: check-runner
    runs-on: [self-hosted, macOS]
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7
      - name: 🔧 Setup Xcode
        uses: ./.github/actions/setup-xcode
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Build mobile web assets
        run: pnpm --dir apps/mobile/web-app build --outDir "${{ github.workspace }}/out/rn-web/html-renderer"
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: 🔨 Build unsigned IPA
        working-directory: apps/mobile
        env:
          PROFILE: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.RN_SENTRY_AUTH_TOKEN }}
        run: bash ../../.github/scripts/build-ios-unsigned-ipa.sh
      - name: 📤 Upload IPA for Sideloadly
        uses: actions/upload-artifact@v7
        with:
          name: feyfeeds-ios-unsigned-ipa
          path: apps/mobile/build.ipa
          retention-days: 30

  build-ipa-github:
    name: Build unsigned IPA (GitHub-hosted)
    if: needs.check-runner.outputs.runner-label == 'macos-26'
    needs: check-runner
    runs-on: macos-26
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7
      - name: 🔧 Setup Xcode
        uses: ./.github/actions/setup-xcode
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Build mobile web assets
        run: pnpm --dir apps/mobile/web-app build --outDir "${{ github.workspace }}/out/rn-web/html-renderer"
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: 🔨 Build unsigned IPA
        working-directory: apps/mobile
        env:
          PROFILE: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.RN_SENTRY_AUTH_TOKEN }}
        run: bash ../../.github/scripts/build-ios-unsigned-ipa.sh
      - name: 📤 Upload IPA for Sideloadly
        uses: actions/upload-artifact@v7
        with:
          name: feyfeeds-ios-unsigned-ipa
          path: apps/mobile/build.ipa
          retention-days: 30
